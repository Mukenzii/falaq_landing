# Falaq Nashr: the static site on nginx. No backend or database: content is frontend/data.js,
# Uzum prices are frontend/uzum.js (npm run sync:uzum, then rebuild).
# Start:  docker compose up -d --build
# Open:   http://localhost:8080

services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
