# Static site: index.html, app.js, data.js (content), uzum.js (Uzum prices) and assets/.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  client_max_body_size 1m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Hidden paths (.env, .git, ...) get a plain 404 instead of the site's index page.
  location ~ /\. {
    return 404;
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 7d;
    add_header Cache-Control "public" always;
  }

  # no-cache: browsers check for a new data.js / uzum.js (after an edit or a sync) on every visit.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
