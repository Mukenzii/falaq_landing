# Admin login brute-force guard: 5 attempts per minute per IP (plus a burst of 5).
limit_req_zone $binary_remote_addr zone=admin_login:1m rate=5r/m;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  client_max_body_size 1m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Hidden paths (.env, .git, ...) get a plain 404 instead of the site's index page.
  location ~ /\. {
    return 404;
  }

  location = /api/admin/login {
    limit_req zone=admin_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    # nginx is the edge, so overwrite (not append to) any client-supplied value:
    # the backend's per-IP limits rely on this header.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /admin/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /admin/index.html;
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 7d;
    add_header Cache-Control "public" always;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
